name: queue

on:
  push:
    branches:
      - 'q/**' # "q" stands for "queue"

jobs:
  build:
    uses: ./.github/workflows/build.yml

  fast-forward-main:
    name: Fast-forward main
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - if: needs.build.result != 'success'
      run: exit 1
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Shallow clone lacks main's tip, so push fails with "fetch first"
    - run: git push origin HEAD:main
